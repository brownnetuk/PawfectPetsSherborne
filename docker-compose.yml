services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: pawfectpets
    volumes:
      - mongo_data:/data/db
    networks:
      - pawfectpets

  backend:
    build:
      context: ./backend
    # Without this, a redeploy (e.g. via Portainer's GitOps webhook -- see
    # README.md's "Keeping it updated" section) would silently keep running
    # whatever image already exists under this name instead of rebuilding
    # from the newly-pulled source, so a git push wouldn't actually change
    # anything running.
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3000
      # The app's date handling normalises to "local midnight" and appointment
      # reminder timing uses the server's local clock -- pin it to UK time so
      # that matches the business (otherwise a UTC container fires reminders an
      # hour off during BST).
      TZ: Europe/London
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/pawfectpets?authSource=admin
      # Keep these identical to the values already in backend/.env when
      # migrating -- ENCRYPTION_KEY especially must not change, or every
      # already-encrypted Customer.security.alarmInstructionsEncrypted value
      # becomes permanently undecryptable (JWT_SECRET changing is harmless,
      # it just forces everyone to log in again).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      # This backend's own publicly-reachable URL (no trailing slash) -- see
      # backend/.env.example for what it's used for.
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      # The public frontend ("intake") app's URL -- see backend/.env.example.
      # Already used below for the admin build's VITE_INTAKE_URL; the backend
      # needs it too now, for {{invoice_link}}/{{quote_link}} in emails.
      PUBLIC_INTAKE_URL: ${PUBLIC_INTAKE_URL}
      # APNs credentials for appointment-reminder push (see the
      # appointment-push-setup notes). Leave unset to disable push -- the
      # backend then just logs and skips. APNS_KEY is the .p8 file's contents
      # pasted as-is (a multi-line Portainer env value is fine).
      APNS_KEY: ${APNS_KEY}
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID}
      # The customer portal app's bundle id (its own apns-topic) -- enables
      # per-customer push. Same .p8 key/Key ID/Team ID as the staff app.
      APNS_CUSTOMER_BUNDLE_ID: ${APNS_CUSTOMER_BUNDLE_ID}
      APNS_PRODUCTION: ${APNS_PRODUCTION}
    # Optional now that cloudflared (below) routes public traffic straight to
    # this service over the internal network -- kept for direct host/LAN
    # access (e.g. hitting http://<docker-host>:3000 while debugging).
    # Remove if you'd rather nothing but the tunnel can reach it at all.
    ports:
      - "3000:3000"
    networks:
      - pawfectpets

  admin:
    build:
      context: ./admin
      args:
        # Both are baked into the JS bundle at build time -- must be the
        # real, publicly-reachable URLs a staff member's browser can load,
        # not the in-network service names above.
        VITE_API_URL: ${PUBLIC_API_URL}
        VITE_INTAKE_URL: ${PUBLIC_INTAKE_URL}
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - pawfectpets

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - pawfectpets

  # Replaces a reverse proxy + manual TLS: cloudflared makes an outbound-only
  # connection to Cloudflare's edge, so nothing here needs a port opened on
  # the host to be reachable from the internet. Public Hostname routing
  # (which domain maps to which internal service) is configured in the
  # Cloudflare Zero Trust dashboard for this tunnel, not in this file --
  # point each hostname at http://backend:3000 / http://admin:80 /
  # http://frontend:80 there (the in-network service names above, since
  # cloudflared reaches them over this same Docker network).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - pawfectpets

networks:
  pawfectpets:

volumes:
  mongo_data:
