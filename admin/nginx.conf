server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: any path that isn't a real static file falls back to index.html so
    # React Router's client-side routes (e.g. /customers/:id) work on a hard
    # refresh or direct link, matching render.yaml's equivalent rewrite rule.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
