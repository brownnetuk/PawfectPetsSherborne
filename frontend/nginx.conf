server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: any path that isn't a real static file falls back to index.html --
    # App.tsx parses /intake/:id, /intake/:id/add-pet, and /forms/:id itself
    # from window.location.pathname, so every one of those needs to actually
    # load index.html on a direct link/hard refresh, matching render.yaml's
    # equivalent rewrite rule.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
